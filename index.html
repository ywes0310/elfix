<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>elfix — 승강기 고장 확인 순서</title>
<meta name="description" content="증상을 고르면 확인할 원인 후보가 순서대로 나옵니다. 승강기 현장 기사를 위한 점검 순서 정리.">
<meta name="theme-color" content="#10151B">
<meta property="og:type" content="website">
<meta property="og:title" content="elfix — 승강기 고장 확인 순서">
<meta property="og:description" content="증상을 고르면 확인할 원인 후보가 순서대로 나옵니다.">
<meta property="og:locale" content="ko_KR">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="elfix">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--shaft:#10151B;--panel:#1A222C;--panel-hi:#232E3A;--line:#33404F;--ink:#E8EDF3;
--dim:#8FA0B3;--signal:#FFB020;--pass:#3ECF8E;--tape-a:#F5C518;--tape-b:#141A21;--r:14px;
--top:calc(52px + env(safe-area-inset-top))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overscroll-behavior-y:contain}
body{background:var(--shaft);color:var(--ink);font-size:16px;line-height:1.55;
padding:0 0 calc(40px + env(safe-area-inset-bottom));
font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,-apple-system,sans-serif;
-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
.mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
button{font:inherit;color:inherit}

/* 상단 고정 바 — 상세 화면에서만 */
.topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:none;
background:rgba(16,21,27,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
padding-top:env(safe-area-inset-top)}
.topbar.show{display:block}
.topbar-in{max-width:560px;margin:0 auto;padding:0 8px 0 4px;height:52px;display:flex;align-items:center;gap:6px}
.tb-back{background:none;border:0;padding:12px 10px;cursor:pointer;display:flex;align-items:center;
gap:5px;font-size:15px;color:var(--ink);border-radius:10px}
.tb-back:active{background:var(--panel)}
.tb-title{flex:1;min-width:0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-prog{flex:0 0 auto;font-size:13px;color:var(--dim);padding-right:8px}
.tb-prog b{color:var(--pass);font-weight:700}
body.detail{padding-top:var(--top)}

header{padding:calc(20px + env(safe-area-inset-top)) 0 18px;border-bottom:1px solid var(--line);margin-bottom:18px}
.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--signal);text-transform:uppercase;font-weight:600;margin:0 0 6px}
h1{font-size:23px;font-weight:700;margin:0 0 8px;letter-spacing:-.01em}
.basis{font-size:12.5px;color:var(--dim);margin:0}
.prompt{font-size:14px;color:var(--dim);margin:0 0 12px}
.sym-list{display:flex;flex-direction:column;gap:9px;margin:0 0 20px;padding:0;list-style:none}
.sym{width:100%;display:flex;align-items:center;gap:13px;background:var(--panel);
border:1px solid var(--line);border-radius:var(--r);padding:17px 15px;text-align:left;
cursor:pointer;transition:border-color .15s,background .15s,transform .08s}
.sym:hover{border-color:var(--signal)}
.sym:active{transform:scale(.985);background:var(--panel-hi)}
.sym:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.sym-i{flex:0 0 28px;text-align:center;font-size:15px;font-weight:700;color:var(--signal)}
.sym-t{flex:1;min-width:0}
.sym-t strong{display:block;font-size:16.5px;font-weight:600;letter-spacing:-.01em}
.sym-t em{display:block;font-style:normal;font-size:12.5px;color:var(--dim);margin-top:2px}
.chev{color:var(--line);font-size:18px}

h2{font-size:21px;margin:0 0 4px;letter-spacing:-.01em;padding-top:18px}
.h2sub{font-size:12.5px;color:var(--dim);margin:0 0 22px}
.block{margin:0 0 24px}
.blk-h{display:flex;align-items:baseline;gap:9px;margin:0 0 11px;font-size:12px;letter-spacing:.13em;
color:var(--signal);font-weight:600;text-transform:uppercase}
.blk-h i{font-style:normal;color:var(--dim);letter-spacing:0;text-transform:none;font-size:12px}
.quick{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.quick li{background:var(--panel);border-radius:10px;padding:11px 13px;font-size:14.5px;border-left:3px solid var(--signal)}

.cands{list-style:none;margin:0;padding:0;position:relative}
.cands:before{content:'';position:absolute;left:13px;top:18px;bottom:18px;width:2px;background:var(--line)}
.cand{position:relative;padding:0 0 10px 44px}
.node{position:absolute;left:6px;top:18px;width:16px;height:16px;border-radius:50%;
background:var(--shaft);border:2px solid var(--line);z-index:1;transition:all .18s}
.cand.on .node{border-color:var(--pass);background:var(--pass);box-shadow:0 0 0 4px rgba(62,207,142,.14)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:border-color .18s}
.cand.on .card{border-color:rgba(62,207,142,.35)}
.cand.exp .card{border-color:var(--signal)}
.card-h{width:100%;background:none;border:0;text-align:left;padding:15px 14px;cursor:pointer;
display:flex;align-items:center;gap:10px}
.card-h:active{background:var(--panel-hi)}
.card-h:focus-visible{outline:2px solid var(--signal);outline-offset:-2px}
.c-name{flex:1;font-size:15.5px;font-weight:600;min-width:0}
.cand.on .c-name{color:var(--dim)}
.c-band{font-size:12px;color:var(--signal);font-weight:600;flex:0 0 auto}
.cand.on .c-band{color:var(--pass)}
.c-open{color:var(--line);font-size:15px;transition:transform .2s;flex:0 0 auto}
.cand.exp .c-open{transform:rotate(90deg)}
.bar{height:4px;background:var(--panel-hi)}
.bar i{display:block;height:100%;background:var(--signal);transition:width .5s}
.cand.on .bar i{background:var(--pass)}
.body{display:none;padding:15px 14px;border-top:1px solid var(--line)}
.cand.exp .body{display:block}
.row{margin:0 0 14px}
.row:last-child{margin:0}
.row h4{margin:0 0 4px;font-size:11px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;font-weight:600}
.row p{margin:0;font-size:14.5px}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.act{background:var(--panel-hi);border-radius:7px;padding:5px 9px;font-size:13px}
.draft{font-size:12.5px;color:var(--tape-a);margin:10px 0 0}
.done{background:none;border:1px solid var(--line);border-radius:10px;color:var(--dim);
font-size:14px;padding:13px 12px;margin-top:14px;cursor:pointer;width:100%;transition:all .15s}
.done:active{background:var(--panel-hi)}
.cand.on .done{border-color:var(--pass);color:var(--pass)}

.tape{border-radius:12px;overflow:hidden;background:var(--panel);border:1px solid rgba(245,197,24,.28)}
.tape-top{height:8px;background:repeating-linear-gradient(45deg,var(--tape-a) 0 11px,var(--tape-b) 11px 22px)}
.tape-body{padding:13px 15px}
.tape-body p{margin:0 0 7px;font-size:14px}
.tape-body p:last-child{margin:0}
.tape-body b{color:var(--tape-a)}
.note{font-size:12.5px;color:var(--dim);margin:10px 0 0}

.allchk{display:none;background:rgba(62,207,142,.08);border:1px solid rgba(62,207,142,.35);
border-radius:12px;padding:14px;margin:4px 0 0}
.allchk.show{display:block}
.allchk p{margin:0;font-size:14.5px}
.allchk b{color:var(--pass)}

.fb{margin:22px 0 0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px;scroll-margin-top:calc(var(--top) + 12px)}
.fb h4{margin:0 0 4px;font-size:15px;font-weight:600}
.fb .sub{margin:0 0 12px;font-size:12.5px;color:var(--dim)}
.fb-btns{display:flex;gap:8px;margin:0 0 10px}
.fb-btn{flex:1;background:var(--panel-hi);border:1px solid var(--line);border-radius:10px;
font-size:14.5px;padding:13px;cursor:pointer;transition:all .15s}
.fb-btn:active{background:var(--line)}
.fb-btn.sel{border-color:var(--pass);color:var(--pass);background:rgba(62,207,142,.08)}
.fb-in{width:100%;background:var(--shaft);border:1px solid var(--line);border-radius:10px;
color:var(--ink);font:inherit;font-size:15px;padding:12px;resize:vertical;min-height:68px;
scroll-margin-top:calc(var(--top) + 12px)}
.fb-in::placeholder{color:var(--dim)}
.fb-in:focus{outline:none;border-color:var(--signal)}
.fb-send{width:100%;margin-top:8px;background:var(--signal);border:0;border-radius:10px;
color:#141A21;font-weight:600;font-size:15px;padding:13px;cursor:pointer;transition:opacity .15s}
.fb-send:disabled{background:var(--panel-hi);color:var(--dim);cursor:default}
.fb-ok{font-size:14px;color:var(--pass);margin:10px 0 0}
.tolist{display:block;width:100%;margin:18px 0 0;background:var(--panel);border:1px solid var(--line);
border-radius:12px;padding:15px;font-size:15px;color:var(--dim);cursor:pointer;transition:all .15s}
.tolist:active{background:var(--panel-hi);color:var(--ink)}

.install{display:none;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
border-radius:12px;padding:12px 10px 12px 14px;margin:0 0 16px}
.install.show{display:flex}
.install p{margin:0;flex:1;font-size:13.5px}
.install .go{background:var(--signal);border:0;border-radius:9px;color:#141A21;
font-weight:600;font-size:13.5px;padding:10px 14px;cursor:pointer;flex:0 0 auto}
.install .x{background:none;border:0;color:var(--dim);padding:10px 6px;cursor:pointer;font-size:15px;flex:0 0 auto}

footer{border-top:1px solid var(--line);margin-top:26px;padding-top:16px;font-size:12px;color:var(--dim)}
footer p{margin:0 0 6px}
.hidden{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<div class="topbar" id="topbar">
  <div class="topbar-in">
    <button class="tb-back" id="tbBack" aria-label="증상 목록으로 돌아가기">‹ 목록</button>
    <span class="tb-title" id="tbTitle"></span>
    <span class="tb-prog" id="tbProg"></span>
  </div>
</div>

<div class="wrap">
  <header id="head">
    <p class="eyebrow">elfix</p>
    <h1>고장 확인 순서</h1>
    <p class="basis">승강기 고장 신고를 받았을 때, 증상을 고르면 확인할 원인 후보가 순서대로 나옵니다.</p>
  </header>

  <div class="install" id="install">
    <p id="instMsg">홈 화면에 두면 신호 없는 기계실에서도 열립니다.</p>
    <button class="go" id="instBtn">설치</button>
    <button class="x" id="instX" aria-label="닫기">✕</button>
  </div>

  <section id="list">
    <p class="prompt">지금 신고받은 증상을 고르세요.</p>
    <ul class="sym-list" id="symList"></ul>
    <p class="note">원인 후보는 현장에서 실제로 많이 나온 순서로 정렬돼 있습니다. 위에서부터 확인하면 대개 위쪽에서 끝납니다.</p>
  </section>

  <section id="detail" class="hidden"></section>

  <footer>
    <p><b style="color:var(--ink)">elfix</b> · 현장 참고용입니다. 실제 조치는 기종별 매뉴얼과 사내 절차를 따르세요.</p>
    <p>틀린 부분을 알려주시면 반영합니다.</p>
  </footer>
</div>

<script>
/* ─────────────────────────────────────────────────────────
   수집 주소. 비워두면 브라우저 콘솔에만 남습니다.
   구글 앱스스크립트 웹앱 주소를 넣으면 시트에 쌓입니다.
   설정 방법은 같이 들어 있는 수집설정.md 를 보세요.
   ───────────────────────────────────────────────────────── */
const ENDPOINT = '';
const SID=(()=>{try{let s=localStorage.getItem('sid');
  if(!s){s=Math.random().toString(36).slice(2,10);localStorage.setItem('sid',s);}return s;}
  catch(e){return 't'+Math.random().toString(36).slice(2,10);}})();
const T0=Date.now();
function track(ev,d){
  const p={sid:SID,ev,d:d||'',t:Math.round((Date.now()-T0)/1000)};
  if(!ENDPOINT){console.log('[log]',p);return;}
  const body=JSON.stringify(p);
  /* text/plain 으로 보내야 사전요청(preflight) 없이 통과한다 */
  try{
    if(navigator.sendBeacon&&navigator.sendBeacon(ENDPOINT,new Blob([body],{type:'text/plain;charset=UTF-8'})))return;
  }catch(e){}
  try{fetch(ENDPOINT,{method:'POST',mode:'no-cors',keepalive:true,
    headers:{'Content-Type':'text/plain;charset=UTF-8'},body});}catch(e){}
}
track('open');

function pushView(code){
  if(histMode==='off')return;
  try{history.pushState({c:code},'','#'+code);return;}catch(e){histMode='state';}
  try{history.pushState({c:code},'');return;}catch(e){histMode='off';}
}
/* 샌드박스 iframe 에서는 history.back() 이 조용히 무시된다.
   그래서 화면을 먼저 되돌리고, 히스토리 정리는 뒤따라 시도한다. */
let navLock=false;
function popView(){
  showList();
  if(histMode!=='off'){
    navLock=true;
    try{history.back();}catch(e){}
    setTimeout(()=>{navLock=false;},350);
  }
}

symList.addEventListener('click',e=>{const b=e.target.closest('.sym');
  if(b){const d=DATA.find(x=>x.code===b.dataset.c);track('symptom',d.code);
    pushView(d.code);render(d);}});

function render(d){
  cur=d;
  detail.innerHTML=`
  <h2>${d.name}</h2>
  <p class="h2sub">확인할 원인 후보 ${d.causes.length}가지 — 위에서부터 확인하세요.</p>
  ${d.quick.length?`<div class="block"><div class="blk-h">먼저 <i>30초 안에</i></div>
    <ul class="quick">${d.quick.map(q=>`<li>${q}</li>`).join('')}</ul></div>`:''}
  <div class="block"><div class="blk-h">원인 후보 <i>흔한 순서</i></div>
    <ul class="cands" id="cands">${d.causes.map((c,i)=>`
      <li class="cand" data-i="${i}"><span class="node" aria-hidden="true"></span>
        <div class="card">
          <button class="card-h" aria-expanded="false"><span class="c-name">${c.name}</span>
            <span class="c-band">${c.band}</span><span class="c-open" aria-hidden="true">›</span></button>
          <div class="bar" aria-hidden="true"><i style="width:${c.w}%"></i></div>
          <div class="body">
            <div class="row"><h4>확인 방법</h4><p>${c.how}</p></div>
            <div class="row"><h4>판정 기준</h4><p>${c.judge}</p></div>
            ${c.acts.length?`<div class="row"><h4>주로 하는 조치</h4>
              <div class="acts">${c.acts.map(a=>`<span class="act">${a}</span>`).join('')}</div></div>`:''}
            ${c.drafted?'':'<p class="draft">이 항목은 확인 방법이 아직 정리되지 않았습니다.</p>'}
            <button class="done">확인함 — 다음 후보로</button>
          </div>
        </div></li>`).join('')}
    </ul>
    <div class="allchk" id="allchk"><p><b>여기까지 다 확인했는데도 안 잡혔습니다.</b><br>
      아래에 실제 원인을 적어주시면 다음 버전에 후보로 들어갑니다.</p></div>
  </div>
  ${d.dont.length?`<div class="block"><div class="blk-h">하지 말 것</div>
    <div class="tape"><div class="tape-top"></div><div class="tape-body">${d.dont.map(x=>`<p>${x}</p>`).join('')}</div></div></div>`:''}
  <div class="fb" id="fb">
    <h4>이 순서가 맞았습니까?</h4>
    <p class="sub">실제 원인이 뭐였는지 한 줄만 적어주시면 다음 버전에 반영됩니다.</p>
    <div class="fb-btns">
      <button class="fb-btn" data-v="hit">맞았다</button>
      <button class="fb-btn" data-v="miss">아니다</button>
    </div>
    <textarea class="fb-in" id="fbTxt" placeholder="예: 결국 도어 벨트 파손이었음"></textarea>
    <button class="fb-send" id="fbSend" disabled>보내기</button>
    <p class="fb-ok hidden" id="fbOk">고맙습니다. 반영하겠습니다.</p>
  </div>
  <button class="tolist" id="toList">‹ 증상 목록으로</button>`;

  head.classList.add('hidden');install.classList.remove('show');
  listEl.classList.add('hidden');detail.classList.remove('hidden');
  topbar.classList.add('show');document.body.classList.add('detail');
  tbTitle.textContent=d.name;scrollTo(0,0);updateProg();

  /* 피드백 — 선택이든 입력이든 하나만 있어도 보낼 수 있게 */
  let fbV=null;
  const fbSend=$('fbSend'),fbTxt=$('fbTxt'),fbOk=$('fbOk');
  const refresh=()=>fbSend.disabled=!(fbV||fbTxt.value.trim());
  detail.querySelectorAll('.fb-btn').forEach(b=>b.onclick=()=>{
    const same=b.classList.contains('sel');
    detail.querySelectorAll('.fb-btn').forEach(x=>x.classList.remove('sel'));
    if(same){fbV=null;}else{b.classList.add('sel');fbV=b.dataset.v;}
    refresh();});
  fbTxt.addEventListener('input',refresh);
  fbSend.onclick=()=>{track('feedback',d.code+':'+(fbV||'-')+':'+fbTxt.value.slice(0,120));
    fbSend.disabled=true;fbSend.textContent='보냈습니다';fbOk.classList.remove('hidden');};

  $('toList').onclick=popView;

  const cands=$('cands');
  cands.addEventListener('click',e=>{
    const li=e.target.closest('.cand');if(!li)return;
    const hdr=li.querySelector('.card-h');
    if(e.target.closest('.card-h')){
      const was=li.classList.contains('exp');
      cands.querySelectorAll('.cand').forEach(x=>{x.classList.remove('exp');
        x.querySelector('.card-h').setAttribute('aria-expanded','false');});
      if(!was){li.classList.add('exp');hdr.setAttribute('aria-expanded','true');
        track('cause_open',d.code+':'+d.causes[li.dataset.i].name);}
    }else if(e.target.closest('.done')){
      const undo=li.classList.contains('on');   /* 잘못 눌렀으면 다시 눌러 해제 */
      li.classList.toggle('on');
      li.querySelector('.done').textContent=undo?'확인함 — 다음 후보로':'확인함 (다시 누르면 해제)';
      if(!undo){
        li.classList.remove('exp');hdr.setAttribute('aria-expanded','false');
        track('cause_done',d.code+':'+d.causes[li.dataset.i].name);
        const nx=[...cands.querySelectorAll('.cand')].find(x=>!x.classList.contains('on'));
        if(nx){nx.classList.add('exp');nx.querySelector('.card-h').setAttribute('aria-expanded','true');
          nx.scrollIntoView({block:'center',behavior:'smooth'});}
        else{$('allchk').classList.add('show');track('all_checked',d.code);
          setTimeout(()=>$('fb').scrollIntoView({block:'center',behavior:'smooth'}),260);}
      }else{$('allchk').classList.remove('show');}
      updateProg();
    }});
}

function updateProg(){
  const all=detail.querySelectorAll('.cand'),on=detail.querySelectorAll('.cand.on');
  tbProg.innerHTML=all.length?`<b>${on.length}</b>/${all.length}`:'';
}

function showList(){
  cur=null;detail.classList.add('hidden');detail.innerHTML='';
  listEl.classList.remove('hidden');head.classList.remove('hidden');
  topbar.classList.remove('show');document.body.classList.remove('detail');
  if(deferred)install.classList.add('show');
  scrollTo(0,0);
}
$('tbBack').onclick=popView;
addEventListener('popstate',e=>{
  if(navLock)return;                       /* 목록 버튼이 이미 처리함 */
  const c=e.state&&e.state.c;
  if(c){const d=DATA.find(x=>x.code===c);if(d){render(d);return;}}
  showList();
});
/* 새로고침 시 주소에 남은 해시 처리 */
try{
  const h=(location.hash||'').slice(1);
  const d0=h&&DATA.find(x=>x.code===h);
  if(d0){try{history.replaceState({c:d0.code},'','#'+d0.code);}catch(e){}render(d0);}
}catch(e){}

/* 홈 화면 추가 — 여기서 나는 예외가 화면 전체를 멈추지 않도록 격리 */
let deferred=null;
try{
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream;
let standalone=false;
try{standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}catch(e){}
const ss={get(k){try{return sessionStorage.getItem(k);}catch(e){return null;}},
          set(k,v){try{sessionStorage.setItem(k,v);}catch(e){}}};
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;
  if(!cur)install.classList.add('show');});
if(isIOS&&!standalone&&!ss.get('instX')){
  $('instMsg').textContent='공유 → 홈 화면에 추가를 누르면 신호 없는 기계실에서도 열립니다.';
  $('instBtn').classList.add('hidden');install.classList.add('show');
}
$('instBtn').onclick=async()=>{if(!deferred)return;deferred.prompt();
  await deferred.userChoice;deferred=null;install.classList.remove('show');track('install');};
$('instX').onclick=()=>{install.classList.remove('show');deferred=null;ss.set('instX','1');};

}catch(e){console.warn('install ui skipped',e);}
try{if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}}catch(e){}
</script>
</body>
</html>
